<!DOCTYPE html>
<html>
<head>
    <title>Disaster Early Warning System</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f4f4f4; }
        .container { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0px 0px 10px #ccc; }
        .btn { padding: 10px 20px; margin: 10px; text-decoration: none; color: white; border-radius: 5px; display: inline-block; }
        .btn-user { background-color: #28a745; }
        .btn-admin { background-color: #007bff; }
        .btn-reg { background-color: #6c757d; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Disaster Early Warning System</h1>
        <p>Real-time disaster prediction.</p>
        <hr>
        <a href="{% url 'user_login' %}" class="btn btn-user">User Login</a>
        <a href="{% url 'register' %}" class="btn btn-reg">User Registration</a>
        <br>
        <a href="{% url 'admin_login' %}" class="btn btn-admin">Admin Command Center</a>
    </div>

    {% if messages %}
        {% for m in messages %}
            <p style="color: red;">{{ m }}</p>
        {% endfor %}
    {% endif %}
</body>
</html>

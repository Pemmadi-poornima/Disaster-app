<!DOCTYPE html>
<html>
<head>
    <title>User Registration</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; padding: 50px; text-align: center; }
        .reg-box { background: white; padding: 30px; border-radius: 8px; display: inline-block; width: 350px; border: 1px solid #ddd; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #6c757d; color: white; border: none; }
    </style>
</head>
<body>
    <div class="reg-box">
        <h2>Create Account</h2>
        <form method="post">
            {% csrf_token %}
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="text" name="phone" placeholder="Phone Number" required>
            <select name="location">
                <option value="City A">City A</option>
                <option value="City B">City B</option>
                <option value="City C">City C</option>
            </select>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>
        <p><a href="{% url 'user_login' %}">Already registered? Login</a></p>
    </div>
</body>
</html>
